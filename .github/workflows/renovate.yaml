name: Run Renovate

on:
  repository_dispatch:
    types: [run-renovate]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: read
  id-token: write

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # ✅ 获取 ECR 密码（不登录）
      - name: Get ECR Password
        id: ecr
        run: |
          PASSWORD=$(aws ecr get-login-password --region us-east-1)
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "✅ ECR password retrieved"

      # ✅ 同时 docker login（可选，用于其他 Docker 操作）
      - name: Login Docker to ECR
        run: |
          echo "${{ steps.ecr.outputs.password }}" | \
            docker login --username AWS --password-stdin 317429619308.dkr.ecr.us-east-1.amazonaws.com

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          configurationFile: renovate.json
        env:
          RENOVATE_TOKEN: ${{ secrets.GITOPS_PAT }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          LOG_LEVEL: "debug"
          # ✅ 关键：将密码传递给 Renovate
          RENOVATE_HOST_RULES: |
            [
              {
                "hostType": "docker",
                "matchHost": "317429619308.dkr.ecr.us-east-1.amazonaws.com",
                "username": "AWS",
                "password": "${{ steps.ecr.outputs.password }}"
              }
            ]