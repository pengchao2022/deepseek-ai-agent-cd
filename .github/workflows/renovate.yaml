name: Run Renovate

on:
  repository_dispatch:
    types: [run-renovate]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: read
  id-token: write

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # ✅ 获取 ECR 密码（用于传递给 Renovate）
      - name: Get ECR Password
        id: ecr
        run: |
          PASSWORD=$(aws ecr get-login-password --region us-east-1)
          echo "ecr_password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "✅ ECR password retrieved"

      # ✅ 同时 docker login（用于宿主机 Docker 命令）
      - name: Login to Amazon ECR
        run: |
          echo "${{ steps.ecr.outputs.ecr_password }}" | \
            docker login --username AWS --password-stdin 317429619308.dkr.ecr.us-east-1.amazonaws.com
          echo "✅ Docker logged into ECR successfully"

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          configurationFile: renovate.json
          # ✅ 使用 extraEnv 传递 hostRules
          extraEnv: |
            RENOVATE_HOST_RULES=[{"hostType":"docker","matchHost":"317429619308.dkr.ecr.us-east-1.amazonaws.com","username":"AWS","password":"${{ steps.ecr.outputs.ecr_password }}"}]
        env:
          RENOVATE_TOKEN: ${{ secrets.GITOPS_PAT }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          LOG_LEVEL: "debug"