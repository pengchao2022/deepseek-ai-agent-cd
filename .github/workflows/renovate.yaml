name: Run Renovate

on:
  repository_dispatch:
    types: [run-renovate]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: read
  id-token: write

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get ECR Password
        id: ecr
        run: |
          PASSWORD=$(aws ecr get-login-password --region us-east-1)
          # 使用 echo "::add-mask::$PASSWORD" 保护密码不被打印到日志里
          echo "::add-mask::$PASSWORD"
          echo "ecr_password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          configurationFile: renovate.json
        env:
          RENOVATE_TOKEN: ${{ secrets.GITOPS_PAT }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          LOG_LEVEL: "debug"
          # ✅ 核心修复：直接将输出的密码拼进 HOST_RULES 环境变量中
          RENOVATE_HOST_RULES: '[{"hostType": "docker", "matchHost": "317429619308.dkr.ecr.us-east-1.amazonaws.com", "username": "AWS", "password": "${{ steps.ecr.outputs.ecr_password }}"}]'