name: Generate Static Manifests

on:
  pull_request:
    types:
      - closed
    paths:
      - 'helm/deepseek-agent/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    if: |
      github.event.pull_request.merged == true && 
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.title, 'chore(deps):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install Helmfile & Compatible Helm Diff Plugin
        run: |
          echo "1. Installing compatible helm-diff plugin..."
          helm plugin install https://github.com/databus23/helm-diff --version v3.12.5
          helm plugin list

          echo "2. Installing Helmfile CLI..."
          HELMFILE_VERSION=$(curl -s "https://api.github.com/repos/helmfile/helmfile/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -Lo helmfile.tar.gz "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          tar -zxf helmfile.tar.gz helmfile
          sudo mv helmfile /usr/local/bin/
          helmfile --version

      - name: Generate Manifests via Helmfile
        run: |
          mkdir -p manifests
          helmfile template --file helm/deepseek-agent/helmfile.yaml > manifests/deepseek-agent-spec.yaml

      - name: Create Pull Request for Manifests Update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-update-static-manifests
          title: "chore: auto-generate static manifests for deepseek-agent"
          body: "This PR was automatically generated by GitHub Actions to update static manifests."
          commit-message: "chore: update static manifests for deepseek-agent [skip ci]"
          auto-merge: true
          branch-suffix: timestamp