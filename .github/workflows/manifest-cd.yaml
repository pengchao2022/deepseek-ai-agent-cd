name: Generate Static Manifests

on:
  pull_request:
    types:
      - closed
    paths:
      - 'helm/deepseek-agent/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: |
      github.event.pull_request.merged == true && 
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.title, 'chore(deps):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install Helmfile & Helm Diff Plugin
        run: |
          echo "1. Installing helm-diff plugin..."
          helm plugin install https://github.com/databus23/helm-diff || true
          helm plugin list

          echo "2. Installing Helmfile CLI..."
          HELMFILE_VERSION=$(curl -s "https://api.github.com/repos/helmfile/helmfile/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -Lo helmfile.tar.gz "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          tar -zxf helmfile.tar.gz helmfile
          sudo mv helmfile /usr/local/bin/
          helmfile --version

      - name: Generate Manifests via Helmfile
        run: |
          mkdir -p manifests
          helmfile template --file helm/deepseek-agent/helmfile.yaml > manifests/deepseek-agent-spec.yaml

      - name: Commit and Push Manifests Update Directly
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add manifests/deepseek-agent-spec.yaml
          
          # 检查是否有文件改动，有改动才提交
          if git diff --staged --quiet; then
            echo "No changes in static manifests to commit."
          else
            git commit -m "chore: auto-generate static manifests for deepseek-agent [skip ci]"
            git push origin main
          fi