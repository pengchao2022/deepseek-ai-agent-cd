apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "deepseek-agent.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "deepseek-agent.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: default  
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "deepseek-agent.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io