apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepseek-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "deepseek-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deepseek-agent.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: agent
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uvicorn"]
        args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: deepseek-secret
              key: DEEPSEEK_API_KEY   
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10